services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - ./data/db:/srv/backend/data
      - ./data/uploads:/srv/backend/uploads
      - ./data/exports:/srv/backend/exports
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Ubah ke deploy.resources.reservations.devices jika VPS punya GPU NVIDIA.

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
